# Every group is tested in its own CI job, which tests only the listed files of docs/src.
# Every .md file in docs/src must be listed in a group.
# After editing this file, run `make gen` to update .github/workflows/Test.yml.
ci_test_groups:
  - group: default
    files:
      - AdditiveClosureKronecker.g.autogen.md
      - AdditiveClosureMonoidal.g.autogen.md
      - CategoryOfColumns.g.autogen.md
      - CategoryOfRows.g.autogen.md
      - Opposite_CategoryOfRows_as_CategoryOfColumns.g.autogen.md
      - RowsAndColsOverFields.g.autogen.md
      - WeakHomomorphismTheorem.g.autogen.md
