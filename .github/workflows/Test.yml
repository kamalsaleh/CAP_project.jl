name: Run Julia Tests

on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron: "0 0 * * *"  # Run every day at midnight
  workflow_dispatch:
permissions:
  contents: write

# cancel runs for pull requests on force push
# https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#example-using-a-fallback-value
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: true

jobs:
  prepare_matrices:
    name: Load CI test group config
    runs-on: ubuntu-latest
    outputs:
      package_groups: ${{ steps.load.outputs.package_groups }}
      split_groups: ${{ steps.load.outputs.split_groups }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Load CI test group config
        id: load
        run: |
          package_groups=$(jq -c '.packages' .github/ci_package_groups.json)

          # any package may opt into split testing by adding its own
          # docs/src/ci_test_groups.json (discovered automatically, no
          # package name needs to be hardcoded here)
          shopt -s nullglob
          split_groups=$(
            for config_path in */docs/src/ci_test_groups.json; do
              package="${config_path%%/*}"
              jq -c --arg package "$package" '.groups[] | . + {package: $package}' "$config_path"
            done | jq -cs '.'
          )

          echo "package_groups=$package_groups" >> "$GITHUB_OUTPUT"
          echo "split_groups=$split_groups" >> "$GITHUB_OUTPUT"

          echo "package_groups:"
          echo "$package_groups" | jq '.'
          echo "split_groups:"
          echo "$split_groups" | jq '.'

  test:
    needs: prepare_matrices
    name: ${{ join(matrix.packages, ', ') }} - Julia ${{ matrix.julia-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # groups are loaded from .github/ci_package_groups.json by prepare_matrices
        packages: ${{ fromJson(needs.prepare_matrices.outputs.package_groups) }}
        julia-version:
          - '1.12'
          - 'nightly'
        os:
          - ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
      - name: Install all packages
        run: make install
      - name: Run tests
        run: |
          for pkg in ${{ join(matrix.packages, ' ') }}; do
            make -C "$pkg" test
          done

  test_split:
    needs: prepare_matrices
    # an empty matrix (no package opts into split testing) can hang
    # instead of being skipped, so skip the job outright in that case
    if: needs.prepare_matrices.result == 'success' && needs.prepare_matrices.outputs.split_groups != '[]'
    name: ${{ matrix.group.package }} (${{ matrix.group.group }}) - Julia ${{ matrix.julia-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # groups are loaded from every */docs/src/ci_test_groups.json by prepare_matrices
        group: ${{ fromJson(needs.prepare_matrices.outputs.split_groups) }}
        julia-version:
          - '1.12'
          - 'nightly'
        os:
          - ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
      - name: Install all packages
        run: make install
      - name: Run tests
        env:
          DOCTEST_FILES: ${{ join(matrix.group.files, ',') }}
        run: make -C "${{ matrix.group.package }}" test

  update_subsplits:
    name: Update subsplits
    needs: [test, test_split]
    runs-on: ubuntu-latest
    # test_split is allowed to be skipped (e.g. no package opts into split testing)
    if: |
      always() &&
      github.event_name == 'push' &&
      needs.test.result == 'success' &&
      (needs.test_split.result == 'success' || needs.test_split.result == 'skipped')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
      - name: Install all packages
        run: make install
      - name: Run update_subsplits script
        env:
          JULIA_SUBSPLIT_TOKEN: ${{ secrets.SUBSPLIT_PUSH_SECRET }}
        run: |
          ./dev/update_subsplits.sh
