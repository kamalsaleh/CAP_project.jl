name: Run Julia Tests

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.group.group }} - Julia ${{ matrix.julia-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # generated from .github/ci_test_groups.yml
        group:
          - group: "default"
            files: ["CartesianClosedOpposite.tst.autogen.md", "CartesianLambdaIntroduction.g.autogen.md", "Coequalizer.g.autogen.md", "CoimageObject.g.autogen.md", "Colift.g.autogen.md", "Coproduct.g.autogen.md", "DirectProduct.g.autogen.md", "Equalizer.g.autogen.md", "FiberProduct.g.autogen.md", "FinSet.g.autogen.md", "FinSetNC.g.autogen.md", "HeytingAlgebraOfSubobjects.g.autogen.md", "ImageObject.g.autogen.md", "InitialTerminal.g.autogen.md", "IsEpiMono.g.autogen.md", "IsEqualForElementsOfFinSets.g.autogen.md", "IsHomSetInhabited.g.autogen.md", "IsInjective.g.autogen.md", "IsProjective.g.autogen.md", "Lift.g.autogen.md", "MapOfFinSets.g.autogen.md", "MapOfFinSetsNC.g.autogen.md", "PreCompose.g.autogen.md", "Pushout.g.autogen.md", "PushoutComplement.g.autogen.md", "SingletonMorphism.g.autogen.md", "Skeletal1CartesianClosedOpposite.tst.autogen.md", "Skeletal1CartesianLambdaIntroduction.g.autogen.md", "Skeletal1CoastrictionToImage.g.autogen.md", "Skeletal1Coequalizer.g.autogen.md", "Skeletal1CoimageObject.g.autogen.md", "Skeletal1Colift.g.autogen.md", "Skeletal1Coproduct.g.autogen.md", "Skeletal1DirectProduct.g.autogen.md", "Skeletal1Equalizer.g.autogen.md", "Skeletal1ExactCoverWithGlobalElements.g.autogen.md", "Skeletal1FiberProduct.g.autogen.md", "Skeletal1FinSet.g.autogen.md", "Skeletal1HeytingAlgebraOfSubobjects.g.autogen.md", "Skeletal1ImageEmbedding.g.autogen.md", "Skeletal1ImageObject.g.autogen.md", "Skeletal1InitialTerminal.g.autogen.md", "Skeletal1IsHomSetInhabited.g.autogen.md", "Skeletal1IsInjective.g.autogen.md", "Skeletal1IsProjective.g.autogen.md", "Skeletal1Lift.g.autogen.md", "Skeletal1MapOfFinSets.g.autogen.md", "Skeletal1MonoEpi.g.autogen.md", "Skeletal1MorphismsOfExternalHom.g.autogen.md", "Skeletal1PreCompose.g.autogen.md", "Skeletal1Preimage.g.autogen.md", "Skeletal1Pushout.g.autogen.md", "Skeletal1PushoutComplement.g.autogen.md", "Skeletal1SingletonMorphism.g.autogen.md", "Skeletal1SubobjectClassifier.g.autogen.md", "Skeletal1Topos.g.autogen.md", "Skeletal1WellDefined.g.autogen.md", "SkeletalCartesianClosedOpposite.tst.autogen.md", "SkeletalCartesianLambdaIntroduction.g.autogen.md", "SkeletalCoastrictionToImage.g.autogen.md", "SkeletalCoequalizer.g.autogen.md", "SkeletalCoimageObject.g.autogen.md", "SkeletalColift.g.autogen.md", "SkeletalCoproduct.g.autogen.md", "SkeletalDirectProduct.g.autogen.md", "SkeletalEqualizer.g.autogen.md", "SkeletalExactCoverWithGlobalElements.g.autogen.md", "SkeletalFiberProduct.g.autogen.md", "SkeletalFinSet.g.autogen.md", "SkeletalHeytingAlgebraOfSubobjects.g.autogen.md", "SkeletalImageEmbedding.g.autogen.md", "SkeletalImageObject.g.autogen.md", "SkeletalInitialTerminal.g.autogen.md", "SkeletalIsHomSetInhabited.g.autogen.md", "SkeletalIsInjective.g.autogen.md", "SkeletalIsProjective.g.autogen.md", "SkeletalLift.g.autogen.md", "SkeletalMapOfFinSets.g.autogen.md", "SkeletalMonoEpi.g.autogen.md", "SkeletalMorphismsOfExternalHom.g.autogen.md", "SkeletalPreCompose.g.autogen.md", "SkeletalPreimage.g.autogen.md", "SkeletalPushout.g.autogen.md", "SkeletalPushoutComplement.g.autogen.md", "SkeletalRandomMethods.g.autogen.md", "SkeletalSingletonMorphism.g.autogen.md", "SkeletalSubobjectClassifier.g.autogen.md", "SkeletalTopos.g.autogen.md", "SkeletalWellDefined.g.autogen.md", "SubobjectClassifier.g.autogen.md", "Topos.g.autogen.md", "cocartesian_monoidal_structure.tst.autogen.md", "compare.tst.autogen.md"]
        julia-version:
          - '1.12'
          - '1.13'
          - 'nightly'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
      - name: Restore Julia cache
        uses: julia-actions/cache@v2
      - name: Instantiate and test package
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
        env:
          DOCTEST_FILES: ${{ join(matrix.group.files, ',') }}
