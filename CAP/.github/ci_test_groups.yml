# Every group is tested in its own CI job, which tests only the listed files of docs/src.
# Every .md file in docs/src must be listed in a group.
# After editing this file, run `make gen` to update .github/workflows/Test.yml.
ci_test_groups:
  - group: default
    files:
      - CAP_INTERNAL_ASSERT_VALUE_IS_OF_TYPE_GETTER.tst.autogen.md
      - DummyCategory.g.autogen.md
      - FilterIntersection.md
      - FiniteSkeletalDiscreteCategory.g.autogen.md
      - HandlePrecompiledTowers.g.autogen.md
      - IsWellDefinedForMorphismsWithGivenSourceAndRange.tst.autogen.md
      - ListWithKeys.tst.autogen.md
      - Simplify.tst.autogen.md
      - TerminalCategoryWithMultipleObjects.g.autogen.md
      - TerminalCategoryWithSingleObject.g.autogen.md
      - ZFunctions.md
